<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confeitaria - Frete Grátis</title>
    <link rel="stylesheet" href="./css/style.css"/>
</head>
<body>

    <div class="container">
        <h2>Verificador de Frete Grátis</h2>
        
        <label for="valorPedido">Valor do Pedido (R$):</label>
        <input type="number" id="valorPedido" placeholder="Ex: 180">
        <br><br>

        <label for="clienteVip">Cliente é VIP?</label>
        <input type="checkbox" id="clienteVip">
        <br><br>

        <button id="btnVerificar">Verificar Frete</button>
        
        <br><br>
        <div id="resultado"></div>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
